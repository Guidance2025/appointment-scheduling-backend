services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-guidance-db
    environment:
      ORACLE_PASSWORD: Changeme0
      APP_USER: guidance
      APP_USER_PASSWORD: Changeme0
    ports:
      - "1522:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./init-scripts:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: appointment-backend
    depends_on:
      oracle-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:oracle:thin:@oracle-db:1521/XEPDB1
      DB_USERNAME: guidance
      DB_PASSWORD: Changeme0
      JWT_SECRET: thebigbrownfoxjumpsoverthelazydog
      FRONTEND_URL: http://localhost:5173
      FIREBASE_CONFIG: /app/firebase-service-account.json
    restart: unless-stopped

volumes:
  oracle-data: